<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">

  {{ partial "head.html" . }}

  <body>

    <div id="all">

        <header>

          {{ partial "nav.html" . }}

        </header>

        {{ partial "breadcrumbs.html" . }}

        <div id="content">
            {{ if isset .Params "id" }}

              {{ partial .Params.id . }}

            {{ else }}

            <div class="container">

                <div class="row">

                    <div class="col-md-12">

                        <div>
                          {{ .Content }}
                        </div>

                    </div>

                </div>
                <!-- /.row -->

            </div>
            <!-- /.container -->

            {{ end }}
        </div>
        <!-- /#content -->

        {{ partial "footer.html" . }}

    </div>
    <!-- /#all -->

    {{ partial "scripts.html" . }}

    <script>
      jQuery(document).ready(function() {
          shuffleDomElements(jQuery(".team-members-bureau .team-member"));
          shuffleDomElements(jQuery(".team-members-bureau-old .team-member"));
          /*
          jQuery(".asso-usergroup").each(function (index, element) {
              shuffleDomElements(jQuery(element).find(".team-members-orga .team-member"));
          })
          */
      });
    </script>
  </body>
</html>
